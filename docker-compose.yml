version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=bookshop_db
      - POSTGRES_USER=bookshop_user
      - POSTGRES_PASSWORD=bookshop_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshop_user -d bookshop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://bookshop_user:bookshop_pass@db:5432/bookshop_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: